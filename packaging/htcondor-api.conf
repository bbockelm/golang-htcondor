# htcondor-api, the HTCondor REST/MCP API server.
#
# This file is %config(noreplace): your edits survive an upgrade, and the
# package's version of the file is written alongside as .rpmnew.

# --- daemon under the master -----------------------------------------------
HTTP_API        = /usr/sbin/htcondor-api
#DAEMON_LIST     = $(DAEMON_LIST), HTTP_API
#DC_DAEMON_LIST  = $(DC_DAEMON_LIST) +HTTP_API
HTTP_API_ARGS   = -local-name http_api

#HTTP_API_DEBUG  = http:info schedd:info security:info mcp:info

# --- where it listens ------------------------------------------------------
# Run underneath shared_port, which needs no firewall change: the shared-port
# server forwards non-CEDAR traffic to the daemon's socket, and the daemon
# inherits the endpoint rather than binding anything itself.
#SHARED_PORT_HTTP_FORWARDING_ID = http_api
#HTTP_API_ARGS = -local-name http_api -sock http_api

# --- persistent state ------------------------------------------------------
# The database holds OAuth2 clients, grants and sealed secrets, so it has to
# survive restarts. Naming it in VALID_SPOOL_FILES keeps condor_preen from
# removing a file it does not recognise.
VALID_SPOOL_FILES = $(VALID_SPOOL_FILES) htcondor-api.db*
HTTP_API_DB_PATH  = $(SPOOL)/htcondor-api.db
HTTP_API_KEK_FILE = /etc/condor/htcondor-api/kek

# --- OAuth2 / identity provider --------------------------------------------
#HTTP_API_OAUTH2_ISSUER             = https://ap.example.org:9618
#HTTP_API_OAUTH2_IDP                = https://cilogon.org
#HTTP_API_OAUTH2_CLIENT_ID          = cilogon:/client_id/...
#HTTP_API_OAUTH2_CLIENT_SECRET_FILE = /etc/condor/htcondor-api/cilogon-client-secret
#HTTP_API_OAUTH2_SCOPES             = openid profile email org.cilogon.userinfo
#HTTP_API_OAUTH2_GROUPS_CLAIM       = groups
#HTTP_API_OAUTH2_USERNAME_CLAIM     = username

# --- authorization ---------------------------------------------------------
#HTTP_API_ENABLE_MCP        = true
#HTTP_API_MCP_ACCESS_GROUP  = ap-login
#HTTP_API_WEBUI_ADMIN_GROUP = staff
#HTTP_API_SUPERUSER_GROUP   = admin
#MCP_ADMIN_USERS            = you@ap.example.org

# --- site policy -----------------------------------------------------------
#HTTP_API_SUBMIT_FILE_OVERRIDES    = log = /home/job.log
#HTTP_API_INTERACTIVE_REQUIREMENTS = GWMS_SINGULARITY_MODE =!= "privileged"

# --- secrets this daemon needs ---------------------------------------------
# The key-encryption key, 32 bytes of hex, encrypts long-lived secrets
# (signing keys, HMAC secrets) at rest in the database. It is configured
# above, so the daemon will refuse to start until the file exists:
#
#   install -d -m 0700 /etc/condor/htcondor-api
#   openssl rand -hex 32 > /etc/condor/htcondor-api/kek
#   chmod 0600 /etc/condor/htcondor-api/kek
#
# The daemon will not generate one for itself: a KEK appearing on its own
# would silently invalidate every secret already sealed in the database.
#
# The OAuth2 client secret is issued by the identity provider when the client
# is registered; write it to a file rather than into this config, which is
# world-readable:
#
#   umask 077
#   printf '%s' 'THE-SECRET-FROM-THE-IDP' > /etc/condor/htcondor-api/cilogon-client-secret
#
# Both are read before the daemon drops privilege, so root-owned 0600 files
# are fine and are what you want.
