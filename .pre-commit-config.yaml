# Pre-commit hooks for golang-htcondor
# See https://pre-commit.com for more information
# Install: pip install pre-commit
# Setup: pre-commit install

repos:
  # Go formatting and imports
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        name: Run gofmt
        description: Runs gofmt to format Go code
      - id: go-imports
        name: Run goimports
        description: Runs goimports to organize Go imports
      - id: go-mod-tidy
        name: Run go mod tidy
        description: Ensures go.mod and go.sum are up to date

  # golangci-lint
  #
  # Must be built with a Go at least as new as the floor in go.mod, or it
  # refuses to start: "the Go language version used to build golangci-lint
  # is lower than the targeted Go version". v2.6.1 predates the 1.26 floor
  # and so blocked every commit; v2.13.2 is built with go1.27.0.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint
        name: Run golangci-lint
        description: Fast linters runner for Go
        args: ['--timeout=5m', '--fix=false']

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: 'classadlog/testdata/.*'
      - id: end-of-file-fixer
        name: Fix end of files
        exclude: 'classadlog/testdata/.*'
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: mixed-line-ending
        name: Check line endings
