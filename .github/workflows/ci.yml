name: CI

# Tests, lint and build read the checkout and nothing else. Declared
# rather than inherited so a widened org default cannot silently hand
# these jobs a writable token.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Track the minimum Go version named in go.mod (currently 1.25).
        # Add new minor versions here when go.mod's `go` directive moves
        # forward; keep at least one version to exercise the matrix.
        go-version: ['1.25']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Install HTCondor
      run: |
        # Add HTCondor APT repository
        wget -qO - https://research.cs.wisc.edu/htcondor/repo/keys/HTCondor-25.x-Key | sudo gpg --dearmor -o /usr/share/keyrings/htcondor-archive-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/htcondor-archive-keyring.gpg] http://research.cs.wisc.edu/htcondor/repo/ubuntu/25.x $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/htcondor.list

        # Update and install HTCondor
        sudo apt-get update
        sudo apt-get install -y condor

    # Multi-module repo (no committed go.work): core at ./, plus ./webapi and
    # ./localcredmon, each building standalone via its `replace ... => ../`.
    # GOWORK=off keeps the result independent of any local workspace.
    - name: Download dependencies
      run: for d in . webapi localcredmon; do (cd "$d" && GOWORK=off go mod download) || exit 1; done

    - name: Verify dependencies
      run: for d in . webapi localcredmon; do (cd "$d" && GOWORK=off go mod verify) || exit 1; done

    - name: Install gotestsum
      run: go install gotest.tools/gotestsum@latest

    - name: Run go vet
      run: make vet

    - name: Run tests
      # Not `make test`: CI needs gotestsum's JUnit output and a coverage profile
      # for Codecov. Core carries the coverage profile; the nested modules run
      # with the race detector.
      run: |
        set -e
        export GOWORK=off
        gotestsum --junitfile=test-results.xml -- -race -coverprofile=coverage.out -covermode=atomic ./...
        (cd webapi && gotestsum --junitfile="$GITHUB_WORKSPACE/test-results-webapi.xml" -- -race ./...)
        (cd localcredmon && gotestsum --junitfile="$GITHUB_WORKSPACE/test-results-localcredmon.xml" -- -race ./...)

    - name: Upload coverage to Codecov
      if: matrix.go-version == '1.25'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lint each module. `make lint` is the developer equivalent; CI uses the
        # official action (pinned to a commit SHA, with a pinned linter version)
        # for its install/caching, once per module directory.
        module: ['.', 'webapi', 'localcredmon']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: ${{ matrix.module }}/go.sum

    - name: Run golangci-lint (${{ matrix.module }})
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.6.1
        working-directory: ${{ matrix.module }}
        args: --timeout=5m
        # Skip `golangci-lint config verify`, which fetches a JSON schema from
        # golangci-lint.run and intermittently times out (flaked Lint jobs on
        # #128/#129). We don't need remote config validation in CI.
        verify: false

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        cache: true

    - name: Build
      run: make build

    - name: Build examples
      run: make examples

  tidy:
    name: Tidy check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        cache: true

    # Fails when a PR leaves any module's go.mod/go.sum stale — notably the
    # examples/* modules, which `replace => ../..` core and so aren't updated by
    # Dependabot's per-module bumps. The failure message points at `make tidy-all`.
    - name: Verify modules are tidy
      run: make tidy-check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    # The Web UI had no CI at all: ci.yml and docker-test.yml never touched
    # webapi/frontend, so a change there merged unverified and the first
    # thing to notice was the release container build (Dockerfile.release
    # stage 1) -- on main, after the fact, as an opaque image-build failure.
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # Match the version Dockerfile.release and release-binaries.yml
        # build with, so a green PR means the release build is green too.
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: webapi/frontend/package-lock.json

    - name: Install dependencies
      working-directory: webapi/frontend
      run: npm ci

    - name: Type check
      working-directory: webapi/frontend
      run: npm run typecheck

    - name: Build
      working-directory: webapi/frontend
      run: npm run build
      env:
        NODE_ENV: production

    # A gate as of #240, which cleared the 10 errors main used to carry
    # (eight of them react-hooks "setState synchronously within an effect").
    # It ran advisory until then because failing every PR on a pre-existing
    # backlog only teaches people to skip the job.
    #
    # Errors fail the build; the four remaining warnings do not. Ratcheting
    # to --max-warnings=0 wants those fixed first -- three are
    # react-hooks/exhaustive-deps on `templates` in submit/page.tsx, which
    # is a real change rather than a mechanical one.
    - name: Lint
      working-directory: webapi/frontend
      run: npm run lint
