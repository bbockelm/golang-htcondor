name: Docker Tests

# The token needs nothing beyond reading the checkout. The repository
# default is already read-only, but declaring it here keeps that true if
# the org default is ever widened, and documents the intent.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker-test:
    name: Test in Docker (Rocky Linux)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            tag: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            tag: arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        load: true
        tags: golang-htcondor:test-${{ matrix.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run tests in Docker
      run: |
        docker run --rm --platform ${{ matrix.platform }} \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          golang-htcondor:test-${{ matrix.tag }} \
          /bin/sh -c "go install gotest.tools/gotestsum@latest && for d in . webapi localcredmon; do (cd \$d && GOWORK=off gotestsum -- -v ./...) || exit 1; done"

    - name: Run build in Docker
      run: |
        docker run --rm --platform ${{ matrix.platform }} \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          golang-htcondor:test-${{ matrix.tag }} \
          /bin/sh -c "git config --global --add safe.directory /workspace && for d in . webapi localcredmon; do (cd \$d && GOWORK=off go build -v ./...) || exit 1; done"

    # The image these steps check is the one just tested, rather than a
    # second build of it. A separate job used to rebuild the whole image
    # -- HTCondor, Go toolchain, gopls, delve -- to run these four
    # commands, taking 3m45s to 8m58s. Layer caching could not fix that:
    # every job in this workflow starts within a second of the others, so
    # the cache the test build writes does not exist yet when a parallel
    # job wants to read it.
    #
    # Running here also checks both platform images; the old job only
    # ever built amd64.
    - name: Verify image toolchain
      run: |
        docker run --rm --platform ${{ matrix.platform }} \
          golang-htcondor:test-${{ matrix.tag }} /bin/bash -c "
            set -e
            go version
            condor_version
            gopls version
            dlv version
            staticcheck -version
          "

    - name: Verify module download works in the image
      run: |
        docker run --rm --platform ${{ matrix.platform }} \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          golang-htcondor:test-${{ matrix.tag }} \
          go mod download

  docker-integration-test:
    name: Integration Test in Docker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: golang-htcondor:integration-test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run integration tests with HTCondor
      run: |
        docker run --rm --privileged \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          golang-htcondor:integration-test \
          /bin/bash -c "
            # Run integration tests (webapi module holds httpserver)
            go install gotest.tools/gotestsum@latest
            cd webapi && GOWORK=off gotestsum -- -tags=integration -timeout=10m ./httpserver/
          "

  # Superuser mode's fallback identity is condor@$(UID_DOMAIN), and that
  # default can only be checked against a pool whose daemons actually run as
  # the condor user -- which requires the pool to have been started by root.
  # HTCondor only treats the daemon's own OS user as the condor identity when
  # personal_condor is false, and personal_condor is simply !is_root().
  #
  # The ordinary integration job cannot cover it: its container runs as
  # "vscode" (USER vscode in the Dockerfile), so every pool it starts is a
  # personal condor. This job exists solely to keep that one shipped default
  # honest, and runs only the tests that need root -- everything else is
  # already covered above, and re-running it here would cost minutes without
  # adding coverage.
  docker-root-integration-test:
    name: Root Integration Test in Docker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: golang-htcondor:integration-test
        # Reads the same cache the integration job writes; identical image.
        cache-from: type=gha

    - name: Run the root-only integration tests
      run: |
        # --user 0:0 overrides the image's USER vscode. The pool's daemons
        # then drop to the condor account, which is the arrangement under
        # test. The submitter accounts the test needs are created in the
        # image; the test skips rather than creating them itself.
        docker run --rm --privileged --user 0:0 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          golang-htcondor:integration-test \
          /bin/bash -c "
            go install gotest.tools/gotestsum@latest
            cd webapi && GOWORK=off gotestsum -- \
              -tags=integration -timeout=10m \
              -run 'AsCondor$' \
              ./httpserver/
          "
