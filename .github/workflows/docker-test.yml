name: Docker Tests

# The token needs nothing beyond reading the checkout. The repository
# default is already read-only, but declaring it here keeps that true if
# the org default is ever widened, and documents the intent.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # The image cache key rotates at 00:00 UTC (see "Derive the image
  # cache key"), so without this the first person to push each day pays
  # the full ~5 minute rebuild in all three jobs. This run happens on
  # main, so it is the one that writes the day's cache; everything after
  # it reads.
  #
  # If the daily Actions minutes are not worth it, delete this trigger:
  # the caching still works, the first push of each day just pays for
  # the rebuild instead.
  schedule:
    - cron: '20 0 * * *'

jobs:
  docker-test:
    name: Test in Docker (Rocky Linux)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            tag: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            tag: arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Derive the image cache key
      id: imgcache
      # The image is rebuilt at most once a day. hashFiles covers the
      # changes somebody committed; the date covers the ones nobody did
      # -- the Dockerfile runs `dnf update -y` and installs an unpinned
      # `condor >= 25.7.2`, so a layer cached indefinitely would drift
      # arbitrarily far from what those lines mean today.
      run: |
        echo "key=$(date -u +%Y-%m-%d)-${{ hashFiles('Dockerfile', '.dockerignore') }}" >> "$GITHUB_OUTPUT"

    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        load: true
        tags: golang-htcondor:test-${{ matrix.tag }}
        # Scope is per-platform: amd64 and arm64 layers have nothing in
        # common, and sharing one scope had them overwriting each
        # other's manifest.
        cache-from: type=gha,scope=img-${{ matrix.tag }}-${{ steps.imgcache.outputs.key }}
        # Only main writes. A pull request's cache is readable by that
        # pull request alone, so every PR build was depositing ~500 MB
        # that nobody else could use -- and evicting, from a 10 GB
        # budget, the one entry on main that everybody could.
        cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=min,scope=img-{0}-{1}', matrix.tag, steps.imgcache.outputs.key) || '' }}

    - name: Run tests in Docker
      run: |
        docker run --rm --platform ${{ matrix.platform }} \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          golang-htcondor:test-${{ matrix.tag }} \
          /bin/sh -c "go install gotest.tools/gotestsum@latest && for d in . webapi localcredmon; do (cd \$d && GOWORK=off gotestsum -- -v ./...) || exit 1; done"

    - name: Run build in Docker
      run: |
        docker run --rm --platform ${{ matrix.platform }} \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          golang-htcondor:test-${{ matrix.tag }} \
          /bin/sh -c "git config --global --add safe.directory /workspace && for d in . webapi localcredmon; do (cd \$d && GOWORK=off go build -v ./...) || exit 1; done"

    # The image these steps check is the one just tested, rather than a
    # second build of it. A separate job used to rebuild the whole image
    # -- HTCondor, Go toolchain, gopls, delve -- to run these four
    # commands, taking 3m45s to 8m58s. Layer caching could not fix that:
    # every job in this workflow starts within a second of the others, so
    # the cache the test build writes does not exist yet when a parallel
    # job wants to read it.
    #
    # Running here also checks both platform images; the old job only
    # ever built amd64.
    - name: Verify image toolchain
      run: |
        docker run --rm --platform ${{ matrix.platform }} \
          golang-htcondor:test-${{ matrix.tag }} /bin/bash -c "
            set -e
            go version
            condor_version
            gopls version
            dlv version
            staticcheck -version
          "

    - name: Verify module download works in the image
      run: |
        docker run --rm --platform ${{ matrix.platform }} \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          golang-htcondor:test-${{ matrix.tag }} \
          go mod download

  docker-integration-test:
    name: Integration Test in Docker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Derive the image cache key
      id: imgcache
      # The image is rebuilt at most once a day. hashFiles covers the
      # changes somebody committed; the date covers the ones nobody did
      # -- the Dockerfile runs `dnf update -y` and installs an unpinned
      # `condor >= 25.7.2`, so a layer cached indefinitely would drift
      # arbitrarily far from what those lines mean today.
      run: |
        echo "key=$(date -u +%Y-%m-%d)-${{ hashFiles('Dockerfile', '.dockerignore') }}" >> "$GITHUB_OUTPUT"

    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: golang-htcondor:integration-test
        # Same Dockerfile, same platform as the amd64 matrix job, so it
        # reads that job's scope. It deliberately does not write: the two
        # run concurrently, and a second writer of identical layers costs
        # cache budget without adding anything readable.
        cache-from: type=gha,scope=img-amd64-${{ steps.imgcache.outputs.key }}

    - name: Run integration tests with HTCondor
      run: |
        docker run --rm --privileged \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          golang-htcondor:integration-test \
          /bin/bash -c "
            # Run integration tests (webapi module holds httpserver)
            go install gotest.tools/gotestsum@latest
            cd webapi && GOWORK=off gotestsum -- -tags=integration -timeout=10m ./httpserver/
          "
