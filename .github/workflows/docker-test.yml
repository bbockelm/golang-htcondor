name: Docker Tests

# The token needs nothing beyond reading the checkout. The repository
# default is already read-only, but declaring it here keeps that true if
# the org default is ever widened, and documents the intent.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker-test:
    name: Test in Docker (Rocky Linux)
    runs-on: ${{ matrix.runner }}
    strategy:
      # Let both platforms report. With the default fail-fast, the first
      # failure cancels its sibling, and a cancelled job's log says only
      # "The operation was canceled" -- so a genuine arm64 error shows up
      # as two broken jobs with the cause visible in neither.
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            tag: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            tag: arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Derive the image cache key
      id: imgcache
      # The image is rebuilt at most once a day. hashFiles covers the
      # changes somebody committed; the date covers the ones nobody did
      # -- the Dockerfile runs `dnf update -y` and installs an unpinned
      # `condor >= 25.7.2`, so a layer cached indefinitely would drift
      # arbitrarily far from what those lines mean today.
      #
      # The rotation is not warmed by a scheduled run, deliberately: the
      # nightly Actions minutes cost more than the rebuild they save.
      # The first push to main each day therefore pays for that day's
      # image, and everything after it -- including every pull request
      # -- reads the result.
      run: |
        echo "key=$(date -u +%Y-%m-%d)-${{ hashFiles('Dockerfile', '.dockerignore') }}" >> "$GITHUB_OUTPUT"

    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        load: true
        tags: golang-htcondor:test-${{ matrix.tag }}
        # Scope is per-platform: amd64 and arm64 layers have nothing in
        # common, and sharing one scope had them overwriting each
        # other's manifest.
        cache-from: type=gha,scope=img-${{ matrix.tag }}-${{ steps.imgcache.outputs.key }}
        # Only main writes. A pull request's cache is readable by that
        # pull request alone, so every PR build was depositing ~500 MB
        # that nobody else could use -- and evicting, from a 10 GB
        # budget, the one entry on main that everybody could.
        cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=min,scope=img-{0}-{1}', matrix.tag, steps.imgcache.outputs.key) || '' }}

    # The Go build and module caches used INSIDE the containers. They
    # live under the bind-mounted workspace so they survive the
    # container, and are restored here so they survive the run.
    #
    # Keyed per platform: arm64 object code is not amd64 object code.
    # restore-keys means a go.sum change warms from the previous cache
    # rather than starting cold -- most dependencies are unchanged.
    - name: Restore the container Go cache
      id: gocache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .gocache
        key: docker-gocache-${{ matrix.tag }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          docker-gocache-${{ matrix.tag }}-

    # The image runs as a non-root user (USER vscode in the Dockerfile)
    # while the workspace bind mount is owned by the runner user, so the
    # container cannot create its own cache directory inside it -- the
    # first attempt failed with "mkdir /workspace/.gocache: permission
    # denied". Nothing hit this before because the containers only read
    # the mount; the Go caches used to live inside the container.
    #
    # The uid comes from the image rather than being hardcoded, so this
    # keeps working if the Dockerfile's user ever changes.
    - name: Prepare the container Go cache directory
      run: |
        ids=$(docker run --rm golang-htcondor:test-${{ matrix.tag }} sh -c 'echo $(id -u):$(id -g)')
        mkdir -p .gocache
        sudo chown -R "$ids" .gocache

    # Tests and build share ONE container. They used to be two `docker
    # run`s, and a container's Go build cache dies with it -- so the
    # build recompiled, from nothing, everything the test step had just
    # compiled. In one container the build reuses that work.
    #
    # GOCACHE and GOMODCACHE point into the bind-mounted workspace so
    # they outlive the container too, and the step above restores them
    # from the previous run. gotestsum is baked into the image; it used
    # to be fetched and compiled here on every run.
    - name: Run tests and build in Docker
      run: |
        docker run --rm --platform ${{ matrix.platform }} \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          -e GOCACHE=/workspace/.gocache/build \
          -e GOMODCACHE=/workspace/.gocache/mod \
          golang-htcondor:test-${{ matrix.tag }} \
          /bin/sh -c "
            set -e
            git config --global --add safe.directory /workspace
            # Run the modules concurrently and wait on all of them,
            # failing if any did. They were sequential, which cost the
            # sum rather than the max: measured on one run, the root
            # module is 274s, webapi 24s and localcredmon under a
            # second, so overlapping them saves roughly the 25s the two
            # smaller ones take.
            #
            # It is a small win because a SINGLE package dominates --
            # the root package itself is the whole 274s. go test's -p
            # only parallelises across package binaries, so raising it
            # would buy nothing here; the root package's tests each
            # stand up a condor_master on fixed ports and share a
            # CONDOR_CONFIG, so they cannot call t.Parallel() until
            # each one gets its own instance. That is the real lever
            # and it is a test-architecture change, not a flag.
            #
            # Output is captured per module rather than interleaved,
            # because three test streams on one terminal are unreadable
            # and the failing one is the one you need to find.
            # Populate the module cache sequentially first. The three
            # test processes share one GOMODCACHE on the bind-mounted
            # workspace, and starting them cold had them racing on the
            # same download temp files:
            #
            #   open .../@v/v3.27.3.zip558732947.tmp: no such file or
            #   directory
            #
            # go locks that cache, so this may be specific to bind mounts
            # where the lock does not carry; either way, downloading up
            # front costs nothing when the restored cache is warm and
            # removes the race entirely.
            for d in . webapi localcredmon; do (cd \$d && GOWORK=off go mod download); done

            pids=\"\"
            for d in . webapi localcredmon; do
              ( cd \$d && GOWORK=off gotestsum -- -v ./... ) > /tmp/test-\$(echo \$d | tr / _).log 2>&1 &
              pids=\"\$pids \$!\"
            done
            rc=0
            for p in \$pids; do wait \$p || rc=1; done
            for f in /tmp/test-*.log; do echo \"===== \$f =====\"; cat \$f; done
            [ \$rc -eq 0 ] || exit 1

            for d in . webapi localcredmon; do (cd \$d && GOWORK=off go build -v ./...); done
          "


    # Only main writes, for the same reason the image cache does: a pull
    # request's cache is readable by that pull request alone, so saving
    # here would spend a shared 10 GB budget on entries nobody else can
    # use. The container writes as root, so hand ownership back before
    # the runner tars it up.
    - name: Reclaim the container Go cache for the runner
      if: github.ref == 'refs/heads/main'
      # The container wrote this tree as the image's user, so hand
      # ownership back before the runner tars it up. The size goes in the
      # log because this repo has been over GitHub's 10 GB cache budget
      # before, and an entry whose size nobody watches is how that
      # happened.
      run: |
        sudo chown -R "$(id -u):$(id -g)" .gocache
        echo "container Go cache: $(du -sh .gocache | cut -f1)"
        du -sh .gocache/* 2>/dev/null || true
    - name: Save the container Go cache
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .gocache
        key: docker-gocache-${{ matrix.tag }}-${{ hashFiles('**/go.sum') }}

    # The image these steps check is the one just tested, rather than a
    # second build of it. A separate job used to rebuild the whole image
    # -- HTCondor, Go toolchain, gopls, delve -- to run these four
    # commands, taking 3m45s to 8m58s. Layer caching could not fix that:
    # every job in this workflow starts within a second of the others, so
    # the cache the test build writes does not exist yet when a parallel
    # job wants to read it.
    #
    # Running here also checks both platform images; the old job only
    # ever built amd64.
    - name: Verify image toolchain
      run: |
        docker run --rm --platform ${{ matrix.platform }} \
          golang-htcondor:test-${{ matrix.tag }} /bin/bash -c "
            set -e
            go version
            condor_version
            gopls version
            dlv version
            staticcheck -version
          "

    - name: Verify module download works in the image
      run: |
        docker run --rm --platform ${{ matrix.platform }} \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          golang-htcondor:test-${{ matrix.tag }} \
          go mod download

  docker-integration-test:
    name: Integration Test in Docker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Derive the image cache key
      id: imgcache
      # The image is rebuilt at most once a day. hashFiles covers the
      # changes somebody committed; the date covers the ones nobody did
      # -- the Dockerfile runs `dnf update -y` and installs an unpinned
      # `condor >= 25.7.2`, so a layer cached indefinitely would drift
      # arbitrarily far from what those lines mean today.
      #
      # The rotation is not warmed by a scheduled run, deliberately: the
      # nightly Actions minutes cost more than the rebuild they save.
      # The first push to main each day therefore pays for that day's
      # image, and everything after it -- including every pull request
      # -- reads the result.
      run: |
        echo "key=$(date -u +%Y-%m-%d)-${{ hashFiles('Dockerfile', '.dockerignore') }}" >> "$GITHUB_OUTPUT"

    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: golang-htcondor:integration-test
        # Same Dockerfile, same platform as the amd64 matrix job, so it
        # reads that job's scope. It deliberately does not write: the two
        # run concurrently, and a second writer of identical layers costs
        # cache budget without adding anything readable.
        cache-from: type=gha,scope=img-amd64-${{ steps.imgcache.outputs.key }}

    # Reads the amd64 matrix job's cache -- same platform, same code.
    # It does not save, for the same reason it does not write the image
    # cache: the two jobs run concurrently, so a second writer of the
    # same content only spends budget.
    - name: Restore the container Go cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .gocache
        key: docker-gocache-amd64-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          docker-gocache-amd64-

    # The image runs as a non-root user (USER vscode in the Dockerfile)
    # while the workspace bind mount is owned by the runner user, so the
    # container cannot create its own cache directory inside it -- the
    # first attempt failed with "mkdir /workspace/.gocache: permission
    # denied". Nothing hit this before because the containers only read
    # the mount; the Go caches used to live inside the container.
    #
    # The uid comes from the image rather than being hardcoded, so this
    # keeps working if the Dockerfile's user ever changes.
    - name: Prepare the container Go cache directory
      run: |
        ids=$(docker run --rm golang-htcondor:integration-test sh -c 'echo $(id -u):$(id -g)')
        mkdir -p .gocache
        sudo chown -R "$ids" .gocache

    - name: Run integration tests with HTCondor
      run: |
        docker run --rm --privileged \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          -e GOCACHE=/workspace/.gocache/build \
          -e GOMODCACHE=/workspace/.gocache/mod \
          golang-htcondor:integration-test \
          /bin/bash -c "
            # Run integration tests (webapi module holds httpserver).
            # gotestsum comes from the image; GOCACHE/GOMODCACHE are the
            # restored caches under the bind-mounted workspace.
            cd webapi && GOWORK=off gotestsum -- -tags=integration -timeout=10m ./httpserver/
          "
