name: Browser Tests

# Rendering regressions were the one class nothing caught. The Go tests
# never load a page; the Frontend job in ci.yml proves the UI compiles,
# not that it draws. #224 shipped a log column squeezed to one letter
# per line and #240 rewrote effect timing across five components, both
# with no way to tell whether the result still rendered.
#
# Two suites, cheapest first:
#
#   smoke - the built static export with /api/v1/* answered from
#           fixtures. No daemon, no HTCondor. Fails fast, so an
#           obviously broken build never pays for a container start.
#   full  - the real htcondor-api binary serving the embedded UI
#           against a real personal HTCondor. Catches API contract
#           drift, which frozen fixtures cannot.

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    name: Browser smoke (mocked API)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: webapi/frontend/package-lock.json

    - name: Install dependencies
      working-directory: webapi/frontend
      run: npm ci

    # Browsers are ~150MB and change only when the Playwright version
    # does, so key the cache on the lockfile rather than re-downloading
    # on every run.
    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('webapi/frontend/package-lock.json') }}

    - name: Install browser
      if: steps.pw-cache.outputs.cache-hit != 'true'
      working-directory: webapi/frontend
      run: npx playwright install --with-deps chromium

    # --with-deps installs OS packages the cache cannot carry, so it
    # still has to run on a cache hit; the browser download itself is
    # what the cache saves.
    - name: Install browser system deps
      if: steps.pw-cache.outputs.cache-hit == 'true'
      working-directory: webapi/frontend
      run: npx playwright install-deps chromium

    - name: Build static export
      working-directory: webapi/frontend
      run: npm run build
      env:
        NODE_ENV: production

    - name: Run smoke suite
      working-directory: webapi/frontend
      run: |
        npx serve out -l 3100 &
        npx wait-on http://127.0.0.1:3100 -t 60000
        PLAYWRIGHT_SUITE=smoke npx playwright test

    - name: Upload report
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-smoke-report
        path: webapi/frontend/playwright-report/
        retention-days: 7

  full:
    name: Browser full stack (real HTCondor)
    runs-on: ubuntu-latest
    # Only worth the container start if the pages render at all.
    needs: smoke

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    # Must match docker-test.yml's key exactly, character for character:
    # a gha cache entry is addressed by scope, so reading a different
    # scope than the producer wrote is not a miss to be retried, it is a
    # different cache. This step existing as a copy is the price of
    # `uses:` not being available for a fragment; if the derivation in
    # docker-test.yml changes, change it here too.
    - name: Derive the image cache key
      id: imgcache
      run: |
        echo "key=$(date -u +%Y-%m-%d)-${{ hashFiles('Dockerfile', '.dockerignore') }}" >> "$GITHUB_OUTPUT"

    # Reads the layers docker-test.yml deposited on main. This job used
    # to read a bare `type=gha`, which is a DIFFERENT scope from the one
    # that workflow writes -- so it never hit, and rebuilt HTCondor and
    # the Go toolchain from scratch on every run: 289s against the 61-77s
    # the scoped jobs take.
    #
    # cache-to stays omitted on purpose. This job is a consumer; only
    # main writes, for the reason docker-test.yml records -- a pull
    # request's cache is readable by that pull request alone, so writing
    # here would deposit ~500MB nobody else can use and evict the entry
    # everybody can.
    - name: Build dev image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: golang-htcondor:e2e
        cache-from: type=gha,scope=img-amd64-${{ steps.imgcache.outputs.key }}

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: webapi/frontend/package-lock.json

    - name: Install dependencies
      working-directory: webapi/frontend
      run: npm ci

    - name: Cache Playwright browsers
      id: pw-cache-full
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('webapi/frontend/package-lock.json') }}

    - name: Install browser
      if: steps.pw-cache-full.outputs.cache-hit != 'true'
      working-directory: webapi/frontend
      run: npx playwright install --with-deps chromium

    - name: Install browser system deps
      if: steps.pw-cache-full.outputs.cache-hit == 'true'
      working-directory: webapi/frontend
      run: npx playwright install-deps chromium

    # The UI has to be inside the binary, the way production ships it
    # (Dockerfile.release stage 2). Building the export here and copying
    # it to the embed path means the full suite exercises the same
    # serving path an operator gets.
    - name: Build static export for embedding
      working-directory: webapi/frontend
      run: npm run build
      env:
        NODE_ENV: production

    - name: Start HTCondor and the API server
      run: |
        mkdir -p webapi/httpserver/webui/dist
        cp -r webapi/frontend/out/* webapi/httpserver/webui/dist/
        # Pick a free port and a private directory per run, so two
        # harnesses can share a host and neither depends on a name
        # another user could squat.
        #
        # The SAME number on both sides of -p is required, not cosmetic:
        # the server builds its OAuth redirect from its own host:port, so
        # a host port that differs from the container port sends the
        # browser somewhere the server is not.
        RUNDIR=$(mktemp -d "${TMPDIR:-/tmp}/e2e-harness.XXXXXXXX")
        SERVER_LOG="$RUNDIR/server.log"

        for attempt in 1 2 3; do
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("",0)); p=s.getsockname()[1]; s.close(); print(p)')
          NAME="e2e-$PORT"
          # -h localhost so the base URL the server derives from
          # FULL_HOSTNAME resolves from the runner. Without it the OAuth
          # redirect targets the container's own name and the browser
          # cannot follow it.
          if docker run -d --name "$NAME" --privileged \
            -h localhost \
            -e "E2E_PORT=$PORT" \
            -p "$PORT:$PORT" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            golang-htcondor:e2e \
            /bin/bash -c "scripts/e2e-server.sh"; then
            break
          fi
          # Lost a race for the port between probing and binding it.
          echo "could not start on port $PORT (attempt $attempt)"
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          PORT=""
        done
        [ -n "$PORT" ] || { echo "could not find a free port for the harness"; exit 1; }

        # Later steps need these; nothing else may assume a fixed value.
        echo "E2E_PORT=$PORT" >> "$GITHUB_ENV"
        echo "E2E_CONTAINER=$NAME" >> "$GITHUB_ENV"
        echo "E2E_SERVER_LOG=$SERVER_LOG" >> "$GITHUB_ENV"
        # The server writes READY to its log once condor and the API are
        # both answering; poll for that rather than a fixed sleep.
        for i in $(seq 1 90); do
          if docker logs "$NAME" 2>&1 | grep -q 'E2E-READY'; then break; fi
          if ! docker ps -q --filter name="$NAME" | grep -q .; then
            echo "container exited early:"; docker logs "$NAME"; exit 1
          fi
          sleep 2
        done
        docker logs "$NAME" | tail -20
        docker logs "$NAME" 2>&1 | grep -q 'E2E-READY' || { echo "server never became ready"; exit 1; }
        # Demo mode generates the IDP credentials per run and prints
        # them; the tests read them from here to log in. Written inside
        # the private run directory, which mktemp -d created 0700.
        docker logs "$NAME" > "$SERVER_LOG" 2>&1
        grep -q '^Password:' "$SERVER_LOG" || {
          echo "no admin credentials in the server output; demo mode did not start"; exit 1; }

    - name: Run full suite
      working-directory: webapi/frontend
      run: PLAYWRIGHT_SUITE=full npx playwright test
      env:
        # https, and localhost rather than 127.0.0.1: demo mode serves
        # with a generated cert whose SANs cover the hostname, and the
        # OAuth redirects are built from it. Port and log path come from
        # the start step, which chose both.
        PLAYWRIGHT_BASE_URL: https://localhost:${{ env.E2E_PORT }}

    - name: Server logs on failure
      if: failure()
      # E2E_CONTAINER is empty if the start step failed before naming
      # one; fall back to whatever e2e-* container exists so a startup
      # failure still shows its logs rather than "No such container".
      run: |
        name="${E2E_CONTAINER:-$(docker ps -aq --filter 'name=^e2e-' | head -1)}"
        [ -n "$name" ] || { echo "no harness container to log"; exit 0; }
        docker logs "$name" 2>&1 | tail -200

    - name: Upload report
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-full-report
        path: webapi/frontend/playwright-report/
        retention-days: 7

    - name: Stop container
      if: always()
      # Remove by the name this run chose, and sweep any e2e-* left by a
      # start attempt that lost its port race before recording a name.
      run: |
        [ -z "${E2E_CONTAINER:-}" ] || docker rm -f "$E2E_CONTAINER" || true
        for c in $(docker ps -aq --filter 'name=^e2e-'); do docker rm -f "$c" || true; done
