name: Differential fuzz

# Differential fuzzing of the Go config-file and submit-file parsers against
# HTCondor's own C++ parsers (libcondor_utils), built from source. See
# fuzz/config/README.md and fuzz/submit/README.md.
#
# The token needs nothing beyond reading the checkout.
# One in-flight run per pull request; pushes to main and scheduled runs
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - 'fuzz/**'
      - 'submit*.go'
      - 'schedd_submit*.go'
      - 'hack/*-fuzz*'
      - '.github/workflows/differential-fuzz.yml'
      - '.github/scripts/build-condor-utils.sh'
      - '.github/scripts/differential-fuzz-ci.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'config/**'
      - 'fuzz/**'
      - 'submit*.go'
      - 'schedd_submit*.go'
      - 'hack/*-fuzz*'
      - '.github/workflows/differential-fuzz.yml'
      - '.github/scripts/build-condor-utils.sh'
      - '.github/scripts/differential-fuzz-ci.sh'
  # Weekly, so the corpus keeps growing and HTCondor-side drift shows up
  # even when nothing here changes.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'go test -fuzztime for the fuzzing step'
        required: false
        default: '2m'

env:
  # The HTCondor release the oracle is built from. To bump: change this
  # to a newer release tag and run the workflow (workflow_dispatch). The
  # ccache key includes it, so the first run after a bump builds cold.
  HTCONDOR_REF: v25.14.1

jobs:
  differential-fuzz:
    name: Differential fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        check-latest: true
        go-version-file: .go-version
        cache: true

    - name: Set HTCondor tree locations
      run: |
        {
          echo "HTCONDOR_SRC=$RUNNER_TEMP/htcondor"
          echo "HTCONDOR_BUILD=$RUNNER_TEMP/htcondor-build"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "FUZZ_LOG_DIR=$GITHUB_WORKSPACE/fuzz-logs"
        } >> "$GITHUB_ENV"

    # The HTCondor ref is pinned, so the compiled objects do not change
    # between runs: one entry per (ref, build script) is all there is to
    # save.
    - name: Restore ccache
      id: ccache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ccache
        key: condor-utils-ccache-${{ runner.os }}-${{ env.HTCONDOR_REF }}-${{ hashFiles('.github/scripts/build-condor-utils.sh') }}
        restore-keys: |
          condor-utils-ccache-${{ runner.os }}-${{ env.HTCONDOR_REF }}-
          condor-utils-ccache-${{ runner.os }}-

    - name: Build libcondor_utils
      env:
        INSTALL_DEPS: '1'
      run: .github/scripts/build-condor-utils.sh

    # Saved from main only (pushes and the scheduled run). A pull
    # request's cache entry is readable by that pull request alone, and
    # this repository has hit GitHub's 10 GB cache budget before.
    - name: Save ccache
      if: steps.ccache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ccache
        key: ${{ steps.ccache.outputs.cache-primary-key }}

    # Each target reports its own status rather than failing the job, so a
    # divergence in one parser still lets the other run and both land in the
    # same log.
    - name: Config fuzz
      id: config
      env:
        FUZZTIME: ${{ inputs.fuzztime || '2m' }}
      run: |
        set +e
        .github/scripts/differential-fuzz-ci.sh config "$FUZZTIME"
        echo "rc=$?" >> "$GITHUB_OUTPUT"

    - name: Submit fuzz
      id: submit
      env:
        FUZZTIME: ${{ inputs.fuzztime || '2m' }}
      run: |
        set +e
        .github/scripts/differential-fuzz-ci.sh submit "$FUZZTIME"
        echo "rc=$?" >> "$GITHUB_OUTPUT"

    - name: Upload failing inputs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: differential-fuzz-failing-inputs
        path: |
          fuzz-logs/
          fuzz/config/testdata/fuzz/
          fuzz/submit/testdata/fuzz/
        if-no-files-found: ignore

    - name: Fail the job
      if: steps.config.outputs.rc != '0' || steps.submit.outputs.rc != '0'
      run: |
        echo "::error::differential fuzz failed (config=${{ steps.config.outputs.rc }} submit=${{ steps.submit.outputs.rc }})"
        exit 1
