version: 2

updates:
  # GitHub Actions. Every action in .github/workflows/ is pinned to a commit SHA
  # (with a "# vX.Y.Z" comment). Dependabot bumps the SHA and the comment
  # together, so we keep the security of SHA pinning without the staleness.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A release published minutes ago has had no time to be found
    # malicious. The cooldown makes Dependabot wait before proposing one,
    # which is the same reason the Dockerfile pins its tools to versions
    # that have been public for a while. Security updates are exempt from
    # cooldown by GitHub's own rules, so a real advisory still arrives
    # immediately.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Go modules — one set of updates per module in this multi-module repo. The
  # `replace ... => ../` self-references are local and ignored by Dependabot; it
  # manages the external dependencies (classad, cedar, fosite, ...). Minor and
  # patch bumps are grouped to cut PR noise; majors come as individual PRs.
  #
  # Every module must be listed: a shared dependency bumped in one module makes the
  # others' go.mod/go.sum stale, which the CI tidy-check (make tidy-all) fails. The
  # examples/* modules pull the shared deps transitively through the local replace, so
  # they need updating in the same grouped PR.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/webapi"
      - "/localcredmon"
      - "/examples/*"
      # .github/tools pins the external binaries CI builds -- currently
      # htcondordb, which webapi/httpserver's integration test runs
      # against. It is a module of its own precisely so this pin is
      # visible here: nothing imports it, so bumping it cannot affect any
      # other module's build, and a new htcondordb release arrives as an
      # ordinary PR that runs the integration test against it. See
      # .github/tools/README.md.
      - "/.github/tools"
    schedule:
      interval: "weekly"
    # A release published minutes ago has had no time to be found
    # malicious. The cooldown makes Dependabot wait before proposing one,
    # which is the same reason the Dockerfile pins its tools to versions
    # that have been public for a while. Security updates are exempt from
    # cooldown by GitHub's own rules, so a real advisory still arrives
    # immediately.
    cooldown:
      default-days: 7
      # A major bump is the one most likely to be both disruptive and
      # under-reviewed, so it waits longest.
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]

  # The Web UI's npm dependencies (webapi/frontend). Worth tracking now that
  # they are actually verified: before the Frontend job in ci.yml, nothing
  # built or type-checked this package on a PR, so a dependency bump could
  # only be reviewed by reading it. It now has to survive tsc, next build and
  # the browser tests before it can merge.
  #
  # Minor and patch grouped, as with Go. Majors arrive individually: a Next.js
  # or React major is a migration, not a bump, and bundling it with unrelated
  # updates makes it impossible to revert one without the others.
  #
  # A @playwright/test bump changes the browser cache key in playwright.yml
  # (it hashes package-lock.json), so that PR re-downloads browsers once. That
  # is the intended behaviour -- the cached browsers have to match the client.
  - package-ecosystem: "npm"
    directory: "/webapi/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
